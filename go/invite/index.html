<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>迷迷 — 邀請你一起來</title>
<!-- LINE / Threads / FB 的預覽卡只讀這幾行(爬蟲不跑 JS),所以不隨網址上的邀請碼變;圖沿用 go/share 那一張 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="迷迷">
<meta property="og:title" content="迷迷">
<meta property="og:description" content="查場次、集票根、找影伴。一起來迷迷看電影！">
<meta property="og:url" content="https://mimicinephile.com/go/invite/">
<meta property="og:image" content="https://mimicinephile.com/go/share/og-icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<style>
  body{margin:0;background:#0b0b0b;color:#f2f2f2;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
  main{padding:32px 20px;max-width:360px;width:100%;box-sizing:border-box}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#bdbdbd;font-size:14px;line-height:1.6;margin:0 0 20px}
  a.btn,button.btn{display:block;box-sizing:border-box;width:100%;margin:10px 0;padding:14px 18px;border-radius:12px;border:0;background:#f5c518;color:#111;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
  a.btn.alt,button.btn.alt{background:#222;color:#f2f2f2;border:1px solid #333}
  #codeBox{display:none;margin:0 0 8px}
  #code{display:inline-block;padding:10px 18px;border:1px dashed #f5c518;border-radius:12px;font:700 30px/1.2 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:4px;color:#f5c518;-webkit-user-select:all;user-select:all}
  #status{min-height:20px;margin:8px 0 12px;font-size:13px;color:#f5c518}
  a.small{display:none;color:#bdbdbd;font-size:13px;margin-top:6px}
  #androidNote{display:none;font-size:12px;margin:4px 0 0}
  .hidden{display:none !important}
</style>
</head>
<body>
<main>
  <h1>迷迷</h1>
  <p id="lead">查場次、集票根、找影伴。正在帶你到商店⋯</p>

  <!-- 有碼才顯示(JS 打開);沒有 JS 的人看到的是下面兩顆商店鈕,跟 go/share 一樣 -->
  <div id="codeBox">
    <div id="code"></div>
    <button class="btn alt" id="copy" type="button">複製邀請碼</button>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <button class="btn hidden" id="main" type="button"></button>
  <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.mimicinephile.mimi&referrer=utm_source%3Dshare%26utm_medium%3Dinvite">Google Play 下載</a>
  <a class="btn alt" id="ios" href="https://apps.apple.com/tw/app/apple-store/id6811598741?pt=129408483&ct=invite&mt=8">App Store 下載</a>
  <a class="small" id="other"></a>
  <p id="androidNote">從這裡安裝，註冊時會自動幫你帶入邀請碼。</p>
  <p style="margin-top:16px;font-size:12px">限台灣地區、18 歲以上。</p>
</main>
<script>
  // 照 go/share/ 改的邀請碼下載頁(PM 2026-11-25「十二」可以動工、字定稿)。跟 go/share 差在:
  // ① 有碼時把碼大字顯示、可一鍵複製 —— iPhone 的 App Store 沒有安裝來源可讀,碼只能靠人帶過去;
  // ② 有碼時手機不自動跳商店(跳了碼就一閃而過),改成主鈕「複製邀請碼，前往 ○○」:一按先複製再跳;
  //    沒碼時照 go/share 0.4 秒自動跳(沒東西要記)。電腦一律停在頁上、兩顆鈕。
  // ③ Play 的 referrer 是 utm_medium=invite(go/share 是 month);App 只認 utm_source=share、不看 medium,
  //    所以 App 不用改就會預填,後台的註冊來源分得出這兩個入口。iOS 的 ct 固定 invite(不放每個人的碼)。
  // c 的檢查跟 go/share 一字不差:只收英數、底線、連字號(最多 32 字),其餘一律當沒帶 —— 不讓頁面替任何字串背書。
  // 顯示與複製的碼轉成大寫:App 輸入框本來就會轉大寫、去掉英數以外的字(normalizeInviteCode),這裡只是讓人看的跟 App 一樣。
  (function(){
    var m = /[?&]c=([^&#]*)/.exec(location.search);
    var code = "";
    try { code = m ? decodeURIComponent(m[1].replace(/\+/g, " ")).trim() : ""; } catch (e) { code = ""; }   // 壞掉的 %XX 不讓整段停住
    if (!/^[A-Za-z0-9_-]{1,32}$/.test(code)) code = "";
    var shown = code.toUpperCase();

    var referrer = "utm_source=share&utm_medium=invite" + (code ? "&utm_campaign=" + code : "");
    var android = document.getElementById("android");
    var ios = document.getElementById("ios");
    android.href = "https://play.google.com/store/apps/details?id=com.mimicinephile.mimi&referrer=" + encodeURIComponent(referrer);

    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    var lead = document.getElementById("lead");
    if (isAndroid) document.getElementById("androidNote").style.display = "block";

    // ── 沒碼:跟 go/share 一樣 ──
    if (!code) {
      var target = isIOS ? ios.href : isAndroid ? android.href : null;
      if (target) { setTimeout(function(){ location.replace(target); }, 400); }
      else { lead.textContent = "查場次、集票根、找影伴。用手機打開這一頁，或選下面的商店下載。"; }
      return;
    }

    // ── 有碼 ──
    lead.textContent = "朋友邀請你一起用迷迷。註冊時填這組邀請碼：";
    document.getElementById("code").textContent = shown;
    document.getElementById("codeBox").style.display = "block";
    var status = document.getElementById("status");

    // 複製:先試 Clipboard API(要 https + 使用者按下);不給就退回選取 + execCommand;
    // 兩種都不行(LINE / IG 內建瀏覽器常見)就把碼反白、說「長按複製」。碼一直在頁面上,最壞也是手動。
    function selectCode(){
      var el = document.getElementById("code");
      try { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
    }
    function legacyCopy(){
      var ok = false;
      var t = document.createElement("textarea");
      t.value = shown; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.top = "-1000px"; t.style.opacity = "0";
      document.body.appendChild(t);
      try { t.focus(); t.select(); t.setSelectionRange(0, shown.length); ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(t);
      return ok;
    }
    function copyCode(done){
      function finish(ok){
        if (ok) { status.textContent = "已複製"; }
        else { selectCode(); status.textContent = "長按複製"; }
        done(ok);
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shown).then(function(){ finish(true); }, function(){ finish(legacyCopy()); });
      } else {
        finish(legacyCopy());
      }
    }

    document.getElementById("copy").addEventListener("click", function(){ copyCode(function(){}); });

    if (!isIOS && !isAndroid) return;   // 電腦:碼 + 複製鈕 + 兩顆商店鈕,不跳

    // 手機:主鈕「複製邀請碼，前往 ○○」;另一個商店放成小字連結
    var store = isIOS ? ios : android;
    var otherStore = isIOS ? android : ios;
    android.classList.add("hidden");
    ios.classList.add("hidden");
    var main = document.getElementById("main");
    main.textContent = isIOS ? "複製邀請碼，前往 App Store" : "複製邀請碼，前往 Google Play";
    main.classList.remove("hidden");
    var other = document.getElementById("other");
    other.href = otherStore.href;
    other.textContent = isIOS ? "用 Android 手機？到 Google Play 下載" : "用 iPhone？到 App Store 下載";
    other.style.display = "inline-block";

    // 複製成功 → 0.6 秒後跳(讓人看得到「已複製」);複製失敗 → 不跳(跳了碼就不見了),
    // 碼已反白、提示「長按複製」,同一顆鈕再按一次就直接去商店。
    var copyFailed = false;
    main.addEventListener("click", function(){
      if (copyFailed) { location.href = store.href; return; }
      copyCode(function(ok){
        if (ok) { setTimeout(function(){ location.href = store.href; }, 600); }
        else { copyFailed = true; main.textContent = isIOS ? "前往 App Store" : "前往 Google Play"; }
      });
    });
  })();
</script>
</body>
</html>
