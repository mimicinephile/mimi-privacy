<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重設密碼 — 迷迷 mimi</title>
<meta name="robots" content="noindex">
<!--
  🔴 **安全鐵則(PM 2026-08-26):網址的 hash 上帶著登入 token。**
    · 這一頁不得把 hash 送到任何外部資源 —— 所以**沒有任何外部請求**:
      CSS / JS / logo 全部 inline,字型只用系統內建,沒有追蹤碼。
    · 不把網址或它的任何片段寫進瀏覽器主控台 —— 除錯時最順手的那一行,
      會把 token 留在裝置上。
      ⚠ 這句話刻意**不把那個函式的名字抄進來**:日後若有一格在數「這頁有沒有寫 log」,
        抄進來的註解會讓那一格永遠是紅的(`supabase/CLAUDE.md` 記過三次的形狀)。
    · `no-referrer` 是再一道保險:即使日後有人手滑加了一個外部資源,
      也不會把帶 token 的網址當 Referer 送出去。
    · **不做網頁端的改密碼表單** —— 改密碼只在 App 內,單一實作單一入口。
-->
<meta name="referrer" content="no-referrer">

<script>
/*
  最早執行,決定兩件事:①這是成功還是失效 ②是不是行動裝置。
  ⚠ 放在 body 之前是刻意的:等 DOM 載完再切,使用者會先看到一瞬間的成功畫面
    再被換成失效,那比一開始就顯示失效更糟。
*/
(function () {
  var d = document.documentElement;

  var h = (location.hash || '').slice(1);
  var q = (location.search || '').slice(1);
  var re = /(^|&)error(_code|_description)?=/;
  d.setAttribute('data-state', (re.test(h) || re.test(q)) ? 'error' : 'ok');

  var ua = navigator.userAgent || '';
  d.setAttribute('data-device', /Android|iPhone|iPad|iPod/i.test(ua) ? 'mobile' : 'desktop');
})();
</script>

<style>
  /* 視覺完全沿用確認頁：兩頁必須看起來是同一個系統 */
  :root{
    --bg:#F8F6F0;      /* 奶油白，與驗證信模板同一色 */
    --fg:#1C1B18;      /* 墨黑 */
    --card:#FFFFFF;
    --accent:#C8281E;  /* 信件裡那顆按鈕的紅 */
    --muted:#6B6862;
    --line:#E8E4DA;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",
                -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 20px;
  }
  .card{
    width:100%;
    max-width:400px;
    background:var(--card);
    border-radius:20px;
    padding:36px 28px 28px;
    text-align:center;
    box-shadow:0 2px 24px rgba(28,27,24,.07);
  }
  .logo{width:72px;height:72px;display:block;margin:0 auto 20px}
  h1{font-size:23px;line-height:1.4;margin:0 0 8px;font-weight:700}
  .sub{margin:0 0 26px;color:var(--muted);font-size:15px}

  .btn{
    display:block;
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:16px;
    padding:14px 20px;
    border-radius:12px;
    transition:opacity .15s ease;
  }
  .btn:active{opacity:.82}
  @media (hover:hover){ .btn:hover{opacity:.9} }

  .hint{margin:18px 0 0;color:var(--muted);font-size:13px;line-height:1.65}

  footer{
    margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px;line-height:1.9;
  }
  footer a{color:var(--muted)}

  /* 兩種狀態互斥。預設先藏起失效那組，避免 JS 還沒跑就兩組都閃出來 */
  .state-error{display:none}
  [data-state="error"] .state-ok{display:none}
  [data-state="error"] .state-error{display:block}

  /* 那句小字是講給桌機聽的（規格：桌機小字）。手機上它只會讓人困惑 */
  .desktop-only{display:none}
  [data-device="desktop"] .desktop-only{display:block}
</style>
</head>

<script>
/*
  把 hash **原樣**轉交給 App。

  🔴 這一頁與確認頁的關鍵差別:**token 在 hash 上,轉交時一個字都不能改**。
     所以這裡用裸的 `movieapp:///reset-password#…`,而**不是**確認頁那招
     `intent://` + browser_fallback_url —— `intent://` 的 `#` 之後整段是
     Intent 規格本身(`#Intent;scheme=…;end`),那個位置放不下我們的 hash,
     轉交過去 token 就掉了,而這一頁的唯一功能就是把 token 交出去。
     ⚠ 代價:手機上若沒裝 App,Chrome 可能跳 ERR_UNKNOWN_URL_SCHEME 而不是
       留在本頁。這是**刻意的取捨**(2026-08-26 攤開給產品負責人裁),
       因為「有帳號的人才會收到重設信」,而有帳號就有 App。

  ⚠ 失效狀態不自動跳:那時候把人丟進 App 只會讓他更困惑。
  ⚠ 桌機不自動跳:那裡沒有 App,跳了只會噴錯誤頁。
*/
(function () {
  var d = document.documentElement;
  if (d.getAttribute('data-state') === 'error') return;

  // location.hash 已含開頭的 '#'。沒有 hash 就原樣送去(App 端自己會處理)
  var target = 'movieapp:///reset-password' + (location.hash || '');

  // 按鈕與自動跳走同一個位址,兩條路不要各寫一份規則
  var btn = document.getElementById('open-app');
  if (btn) btn.setAttribute('href', target);

  if (d.getAttribute('data-device') !== 'mobile') return;

  // 約 300ms 後自動嘗試,讓畫面先畫出來(直接跳的話使用者連這一頁都沒看到)
  setTimeout(function () {
    try { location.href = target; } catch (e) { /* 沒裝 App:留在本頁 */ }
  }, 300);
})();
</script>
