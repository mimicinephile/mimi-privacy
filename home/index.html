<style>
  :root{
    --bg:#F8F6F0; --fg:#1C1B18; --card:#FFFFFF; --accent:#C8281E;
    --muted:#6B6862; --line:#E8E4DA;
    --shadow:0 2px 24px rgba(28,27,24,.07);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",
                -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.7; font-size:16px; -webkit-font-smoothing:antialiased;
    overflow-x:clip;
  }
  a{color:var(--accent)}

  main{max-width:760px; margin:0 auto; padding:0 20px 72px}
  .hero{text-align:center; padding:72px 0 8px}
  .hero .mark{font-size:44px; line-height:1}
  .hero h1{font-size:30px; line-height:1.3; margin:14px 0 10px; font-weight:700}
  .hero .lede{margin:0 auto 28px; max-width:26em; color:var(--muted); font-size:17px}

  .stores{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  .store{
    display:inline-block; min-width:180px; text-align:center; text-decoration:none;
    padding:12px 20px; border-radius:999px; font-weight:700; font-size:15.5px;
    background:var(--fg); color:#fff;
  }
  .store.alt{background:var(--card); color:var(--fg); border:1px solid var(--line)}
  .store:hover,.store:focus-visible{opacity:.88}

  .entries{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; margin-top:56px}
  @media (max-width:520px){ .entries{grid-template-columns:1fr} }
  .entry{
    display:block; text-decoration:none; color:var(--fg);
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px; box-shadow:var(--shadow);
  }
  .entry:hover,.entry:focus-visible{border-color:var(--accent)}
  .entry h2{font-size:17px; margin:0 0 4px; font-weight:700}
  .entry h2::after{content:" ›"; color:var(--accent)}
  .entry p{margin:0; color:var(--muted); font-size:14.5px}

  footer{margin-top:64px; padding-top:24px; border-top:1px solid var(--line); color:var(--muted); font-size:13.5px; line-height:2}
</style>
